name: PR Title Check

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize]

# Reads the pull request's title; writes nothing.
permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional Commit Title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
