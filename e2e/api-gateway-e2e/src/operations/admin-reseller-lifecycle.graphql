mutation E2eAdminSuspendReseller($id: String!, $reason: String) {
  adminSuspendReseller(resellerId: $id, reason: $reason) {
    id
    status
    suspendedAt
    version
  }
}

mutation E2eAdminUnsuspendReseller($id: String!) {
  adminUnsuspendReseller(resellerId: $id) {
    id
    status
    suspendedAt
  }
}

mutation E2eAdminDeleteReseller($id: String!) {
  adminDeleteReseller(resellerId: $id) {
    id
    status
    deletedAt
  }
}

query E2eAdminListResellers($filter: AdminListResellersFilterInput) {
  adminListResellers(filter: $filter) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        id
        slug
        tier
        status
        isSystem
        instituteCount
        teamSize
      }
    }
  }
}

query E2eAdminListInstitutes($filter: AdminListInstitutesFilterInput) {
  adminListInstitutes(filter: $filter) {
    totalCount
  }
}

query E2eAdminGetReseller($id: ID!) {
  adminGetReseller(id: $id) {
    id
    version
    registrationNumber
    registrationState
    contact {
      emails {
        address
      }
    }
    address {
      city
    }
    slug
    tier
    status
    isSystem
    instituteCount
    teamSize
  }
}

mutation E2eAdminCreateReseller($input: AdminCreateResellerInput!) {
  adminCreateReseller(input: $input) {
    id
    slug
    tier
    status
    isSystem
    instituteCount
    teamSize
    branding {
      primaryColor
    }
  }
}

mutation E2eAdminUpdateReseller($id: ID!, $input: AdminUpdateResellerInput!) {
  adminUpdateReseller(id: $id, input: $input) {
    id
    name
    version
    registrationNumber
    registrationState
    instituteCount
    teamSize
    address {
      city
      state
    }
    branding {
      primaryColor
    }
  }
}

mutation E2eAdminChangeResellerTier($id: ID!, $tier: ResellerTier!) {
  adminChangeResellerTier(id: $id, newTier: $tier) {
    id
    tier
    teamSize
  }
}

query E2eAdminListResellerTeam($resellerId: ID!) {
  adminListResellerTeam(resellerId: $resellerId) {
    id
    userId
    email
    roleName
    isActive
    lastActiveAt
  }
}

query E2eAdminResellerAuditLogs($filter: AuditLogFilterInput) {
  adminAuditLogs(filter: $filter, first: 50) {
    edges {
      node {
        action
        entityId
        tenantId
      }
    }
  }
}
