# E2E test environment — persistent infra, fast iteration.
# Infra + api-gateway stay running between test runs.
# Code changes auto-reload via nx serve + the repo bind mount.
# Data is reset via `pnpm e2e:clean` (not container teardown).
#
# Always go through scripts/e2e-compose.sh (it sets E2E_UID/E2E_GID and
# pre-creates the dist mountpoint):
#   pnpm e2e:up                          — start the stack (once, stays running)
#   nx run api-gateway-e2e:e2e:vitest    — run vitest E2E in Docker
#   nx run api-gateway-e2e:e2e:rls       — run RLS integration tests in Docker
#   pnpm e2e:down                        — stop containers, keep volumes
#   pnpm e2e:nuke                        — stop containers and wipe volumes

# Backend services share one toolchain-only image and the host checkout:
# source AND node_modules come from the bind mount, so nothing is installed
# or copied at image build time. Requires a Linux host on the Node major in
# .nvmrc (native modules are loaded as installed on the host).
#
# The checkout is mounted at its host path, not /app: pnpm's bin shims embed
# absolute paths (NODE_PATH), so any other mount point changes resolution.
x-backend: &backend
  image: roviq-e2e-backend
  user: "${E2E_UID:?run via scripts/e2e-compose.sh}:${E2E_GID:?run via scripts/e2e-compose.sh}"
  working_dir: ${E2E_WORKSPACE:?run via scripts/e2e-compose.sh}
  env_file: ../.env

# Build output and Nx state are redirected to .e2e/ so the container never
# writes the host's dist/ or .nx/: a shared dist let the container's tsc
# rmSync delete the host dev server's output (636-restart loop, 2026-04-17).
# See docs/troubleshooting.md.
x-backend-volumes: &backend-volumes
  - ..:${E2E_WORKSPACE}
  - ../.e2e/dist:${E2E_WORKSPACE}/dist
  - ../.e2e/nx:${E2E_WORKSPACE}/.nx

services:
  # --- Minimal infra (no observability) ---

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: roviq
      POSTGRES_PASSWORD: roviq_dev
      POSTGRES_DB: roviq
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "${E2E_POSTGRES_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roviq"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir=/data", "-m", "8222"]
    # Host ports offset off dev infra (compose.infra.yaml NATS owns 4222/8222)
    # so the e2e stack coexists with a running dev stack — same convention as
    # postgres (5435 vs dev 5434) and api-gateway (3004 vs dev 3005). The
    # host-side `check:jetstream-drift` script connects via localhost:4223;
    # in-network clients still use `nats:4222` (the container-internal port).
    ports:
      - "${E2E_NATS_PORT:-4223}:4222"
      - "${E2E_NATS_MONITOR_PORT:-8223}:8222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Object storage. The host port is published because tests and browsers on the
  # host open presigned URLs, which are signed for S3_PUBLIC_ENDPOINT.
  object-storage:
    image: rustfs/rustfs:1.0.6
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: roviq_storage
      RUSTFS_SECRET_KEY: roviq_storage_dev
      RUSTFS_ADDRESS: ":9000"
    ports:
      - "${E2E_STORAGE_PORT:-9004}:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Temporal — workflow engine required by admission approval, TC clearance,
  # institute setup, bulk student import, and compliance export workflows.
  # Internal-only (no host port exposure) — api-gateway reaches it via
  # `temporal:7233` on the Docker network.
  temporal:
    image: temporalio/auto-setup:latest
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: roviq
      POSTGRES_PWD: roviq_dev
      POSTGRES_SEEDS: postgres
      # auto-setup runs four services, each with its own pool that keeps maxIdleConns open;
      # the 20/20 + 10/10 defaults held ~50 of Postgres's 100 slots while idle.
      SQL_MAX_CONNS: 10
      SQL_MAX_IDLE_CONNS: 2
      SQL_VIS_MAX_CONNS: 5
      SQL_VIS_MAX_IDLE_CONNS: 1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # auto-setup provisions namespaces asynchronously — use the Temporal
      # CLI against the container's own hostname (the server binds to that
      # IP, not 127.0.0.1, so nc/tctl against localhost fail). Longer retry
      # budget absorbs the 20-30s schema-init window.
      test: ["CMD-SHELL", "temporal operator cluster describe --address temporal:7233 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Email sink for e2e; tests read messages through its API on the host port.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "${E2E_MAILPIT_API_PORT:-8026}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Migrate & seed (one-shot, exits on completion) ---

  migrate-and-seed:
    <<: *backend
    # The only build definition for the shared image. Compose stamps a
    # per-service label into every image it builds, so one tag built by
    # several services changes ID on each `up --build` and the containers
    # get recreated.
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      target: e2e
    command: sh -c "pnpm run db:reset --test && DATABASE_URL_MIGRATE=$$DATABASE_URL_TEST_MIGRATE pnpm run db:seed:e2e && pnpm run storage:init"
    volumes: *backend-volumes
    environment:
      DATABASE_URL_TEST: postgresql://roviq_pooler:roviq_pooler_dev@postgres:5432/roviq_test
      DATABASE_URL_TEST_MIGRATE: postgresql://roviq:roviq_dev@postgres:5432/roviq_test
      # Override host-side REDIS_URL from .env so db-reset can flush the
      # Redis-backed lockout cache (auth rate-limit) on test reset.
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://object-storage:9000
      # storage:init allows browser uploads from these origins (the e2e web app, not the dev one).
      ALLOWED_ORIGINS: "http://localhost:${E2E_WEB_PORT:-4201},http://admin.localhost:${E2E_WEB_PORT:-4201},http://reseller.localhost:${E2E_WEB_PORT:-4201}"
      # drizzle.config.ts conditionally pulls in ee/libs/database/src/schema
      # when ROVIQ_EE=true. CI's .env is provisioned from .env.example which
      # doesn't set ROVIQ_EE, so EE billing tables (plans, subscriptions,
      # invoices, ...) wouldn't be created — api-gateway starts with
      # ROVIQ_EE=true and the schema-drift check fails because the EE GraphQL
      # types aren't registered against existing tables.
      ROVIQ_EE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy

  # --- Application services (dev mode with auto-reload) ---

  api-gateway:
    <<: *backend
    # Cap restart attempts so a container that fails its own build (e.g. a
    # missing dep) doesn't storm-restart. `unless-stopped` produced a
    # 636-restart loop on 2026-04-17. Do NOT revert to `unless-stopped`.
    # See docs/troubleshooting.md.
    restart: on-failure:3
    # This container is the only Nx builder in the stack: it also builds
    # notification-service so two Nx processes never write the shared
    # dist/libs at once.
    # It builds once and runs that output, with no watcher: a watcher rebuilt
    # only the app (never dist/libs) and restarted the gateway mid-test-run.
    # E2E_BACKEND_FINGERPRINT changes with the backend source, so the next
    # `up` (pnpm e2e:up) recreates this container and it rebuilds.
    command: >
      sh -c 'pnpm exec nx run-many -t build -p api-gateway notification-service --parallel=3
      && mkdir -p /tmp/node_path && ln -sfn "$$PWD/dist/libs" /tmp/node_path/@roviq
      && NODE_PATH=/tmp/node_path exec node --require ./dist/libs/telemetry/src/init-telemetry.js dist/apps/api-gateway/src/main.js'
    volumes:
      - ..:${E2E_WORKSPACE}
      - ../.e2e/dist:${E2E_WORKSPACE}/dist
      - ../.e2e/nx:${E2E_WORKSPACE}/.nx
    environment:
      # Override ALL DB URLs to use roviq_test on Docker postgres
      DATABASE_URL: postgresql://roviq_pooler:roviq_pooler_dev@postgres:5432/roviq_test
      # Audit and dead-letter consumers: INSERT into audit_logs and dlq_messages only.
      DATABASE_URL_AUDIT: postgresql://roviq_audit_writer:roviq_audit_writer_dev@postgres:5432/roviq_test
      DATABASE_URL_MIGRATE: postgresql://roviq:roviq_dev@postgres:5432/roviq_test
      # Override service URLs to use Docker network hostnames
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      NOTIFICATION_SERVICE_URL: http://notification-service:3002
      TEMPORAL_ADDRESS: temporal:7233
      S3_ENDPOINT: http://object-storage:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${E2E_STORAGE_PORT:-9004}
      S3_PUBLIC_BASE_URL: http://localhost:${E2E_STORAGE_PORT:-9004}/roviq-public
      # Embedded Temporal worker so approveApplication can reach ENROLLED in e2e.
      STUDENT_ADMISSION_WORKER_ENABLED: "true"
      # Embedded Temporal worker so a bulk student import runs to completion in e2e.
      STUDENT_IMPORT_WORKER_ENABLED: "true"
      # Hourly file sweeper; it only touches rows a day or more old, so tests never race it.
      FILE_SWEEPER_WORKER_ENABLED: "true"
      # Embedded Temporal worker so a compliance export reaches COMPLETED in e2e.
      COMPLIANCE_EXPORT_WORKER_ENABLED: "true"
      # Embedded Temporal worker so a requested TC reaches GENERATED and can be approved and issued.
      TC_ISSUANCE_WORKER_ENABLED: "true"
      # Embedded Temporal worker so an approved institute request reaches setup COMPLETED.
      INSTITUTE_SETUP_WORKER_ENABLED: "true"
      # Monthly audit partition worker; its schedule fires on the 25th, so tests never race it.
      AUDIT_PARTITION_WORKER_ENABLED: "true"
      # E2E-specific overrides
      API_GATEWAY_PORT: "3004"
      ALLOWED_ORIGINS: "http://localhost:${E2E_API_PORT:-3004},http://localhost:${E2E_WEB_PORT:-4201},http://admin.localhost:${E2E_WEB_PORT:-4201},http://reseller.localhost:${E2E_WEB_PORT:-4201}"
      NODE_ENV: test
      # Enable EE modules — the frontend references EE billing operations and the
      # schema-drift gate compares them against the running api-gateway's schema.
      ROVIQ_EE: "true"
      E2E_BACKEND_FINGERPRINT: ${E2E_BACKEND_FINGERPRINT:?run via scripts/e2e-compose.sh}
    depends_on:
      migrate-and-seed:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    ports:
      - "${E2E_API_PORT:-3004}:3004"
    # Real GraphQL probe: "healthy" means the resolver chain answers, not only
    # that the HTTP port is bound. start_period covers a cold build of both
    # apps with an empty Nx cache.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -X POST -H 'Content-Type: application/json' -d '{\"query\":\"{ __typename }\"}' http://localhost:3004/api/graphql | grep -q '\"Query\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
      start_interval: 1s

  notification-service:
    <<: *backend
    restart: on-failure:3
    # Runs the output api-gateway built (hence the healthy dependency), with
    # dist/libs resolved as @roviq/* the same way the production image lays
    # it out.
    command: >
      sh -c 'mkdir -p /tmp/node_path && ln -sfn "$$PWD/dist/libs" /tmp/node_path/@roviq
      && NODE_PATH=/tmp/node_path exec node --require ./dist/libs/telemetry/src/init-telemetry.js dist/apps/notification-service/src/main.js'
    volumes:
      - ..:${E2E_WORKSPACE}
      - ../.e2e/dist:${E2E_WORKSPACE}/dist
    environment:
      DATABASE_URL: postgresql://roviq_pooler:roviq_pooler_dev@postgres:5432/roviq_test
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      # env_file carries the host instance's port; in-network callers use 3002.
      NOTIFICATION_SERVICE_PORT: "3002"
      NODE_ENV: test
      TEMPORAL_ADDRESS: temporal:7233
      NOTIFICATION_WORKER_ENABLED: "true"
      NOTIFICATION_EMAIL_PROVIDER: smtp
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: "Roviq <no-reply@roviq.test>"
      NOTIFICATION_PUSH_PROVIDER: log
      NOTIFICATION_SMS_PROVIDER: log
      NOTIFICATION_WHATSAPP_PROVIDER: log
      E2E_BACKEND_FINGERPRINT: ${E2E_BACKEND_FINGERPRINT:?run via scripts/e2e-compose.sh}
    depends_on:
      api-gateway:
        condition: service_healthy
      nats:
        condition: service_healthy
      temporal:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3002/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
      start_interval: 1s

  # --- Test runners (activated via profiles) ---

  vitest-e2e:
    <<: *backend
    command: pnpm vitest run --config e2e/api-gateway-e2e/vitest.config.ts
    volumes: *backend-volumes
    environment:
      API_URL: http://api-gateway:3004/api/graphql
      WS_URL: ws://api-gateway:3004/api/graphql
      DATABASE_URL_MIGRATE: postgresql://roviq:roviq_dev@postgres:5432/roviq_test
    depends_on:
      api-gateway:
        condition: service_healthy
    profiles: [vitest]

  rls-tests:
    <<: *backend
    command: pnpm vitest run --project integration
    working_dir: ${E2E_WORKSPACE}/libs/database
    volumes: *backend-volumes
    environment:
      DATABASE_URL_TEST: postgresql://roviq_pooler:roviq_pooler_dev@postgres:5432/roviq_test
      DATABASE_URL_TEST_MIGRATE: postgresql://roviq:roviq_dev@postgres:5432/roviq_test
    depends_on:
      migrate-and-seed:
        condition: service_completed_successfully
    profiles: [rls]

