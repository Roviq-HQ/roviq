# NATS server for every stack. Values come from the container's environment: a password must
# hold at least one letter, or the server reads it as a number and refuses to start.
jetstream {
  store_dir: /data
}

# Monitoring has no sign-in of its own. NATS_MONITOR is `127.0.0.1:8222` where only the
# container's health check reads it, `0.0.0.0:8222` in the development stacks.
http: $NATS_MONITOR

# One user per service. No user, no connection.
authorization {
  users = [
    { user: gateway, password: $NATS_GATEWAY_PASSWORD }
    { user: notifications, password: $NATS_NOTIFICATIONS_PASSWORD }
  ]
}
