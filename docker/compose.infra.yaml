services:
  postgres:
    image: postgres:18-alpine
    ports: ["${DEV_POSTGRES_PORT:-5434}:5432"]
    environment:
      POSTGRES_USER: roviq
      POSTGRES_PASSWORD: roviq_dev
      POSTGRES_DB: roviq
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roviq"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["${DEV_REDIS_PORT:-6379}:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    ports:
      - "${DEV_NATS_PORT:-4222}:4222"
      - "${DEV_NATS_MONITOR_PORT:-8222}:8222"
    command: ["--jetstream", "--store_dir=/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats-test:
    image: nats:2.10-alpine
    ports:
      - "${DEV_NATS_TEST_PORT:-4224}:4222"
      - "${DEV_NATS_TEST_MONITOR_PORT:-8224}:8222"
    command: ["--jetstream", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Scrapes NATS' built-in monitoring endpoint (`:8222`) and re-exposes
  # JetStream stream/consumer stats in Prometheus format. Required for the
  # admin observability "Streams" tab.
  nats-exporter:
    image: natsio/prometheus-nats-exporter:latest
    command: ["-varz", "-jsz=all", "-connz", "http://nats:8222"]
    ports:
      - "${DEV_NATS_EXPORTER_PORT:-7777}:7777"
    depends_on:
      nats:
        condition: service_healthy

  mongodb:
    image: mongo:8
    # Host port is 27018 (not the default 27017) to avoid clashing with other
    # local mongo instances. Novu connects via internal DNS (mongodb:27017),
    # so only external tools (mongosh/compass) use localhost:27018.
    ports: ["${DEV_MONGODB_PORT:-27018}:27017"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # S3-compatible object storage. Production uses a managed S3 service (docs/deployment.md).
  object-storage:
    image: rustfs/rustfs:1.0.6
    ports:
      - "${DEV_STORAGE_PORT:-9002}:9000"
      - "${DEV_STORAGE_CONSOLE_PORT:-9003}:9001"
    environment:
      RUSTFS_ACCESS_KEY: roviq_storage
      RUSTFS_SECRET_KEY: roviq_storage_dev
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: /data
    volumes:
      # A named volume: the image runs as uid 10001 and cannot write a root-owned bind mount.
      - object_storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "${DEV_TEMPORAL_PORT:-7233}:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: roviq
      POSTGRES_PWD: roviq_dev
      POSTGRES_SEEDS: postgres
      # auto-setup runs four services, each with its own pool that keeps maxIdleConns open;
      # the 20/20 + 10/10 defaults held ~50 of Postgres's 100 slots while idle.
      SQL_MAX_CONNS: 10
      SQL_MAX_IDLE_CONNS: 2
      SQL_VIS_MAX_CONNS: 5
      SQL_VIS_MAX_IDLE_CONNS: 1
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    ports:
      - "${DEV_TEMPORAL_UI_PORT:-8233}:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ['--config', '/etc/otelcol/config.yaml']
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '${DEV_OTEL_GRPC_PORT:-4317}:4317'
      - '${DEV_OTEL_HTTP_PORT:-4318}:4318'
      - '${DEV_OTEL_HEALTH_PORT:-13133}:13133'
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started

  tempo:
    image: grafana/tempo:2.7.2
    command: ['-config.file=/etc/tempo/config.yaml']
    volumes:
      - ./tempo/tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - '${DEV_TEMPO_PORT:-3200}:3200'

  loki:
    image: grafana/loki:latest
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - '${DEV_LOKI_PORT:-3100}:3100'

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ../docs/observability/alerts:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - '${DEV_PROMETHEUS_PORT:-9090}:9090'
    healthcheck:
      test: ['CMD', 'wget', '--spider', 'http://localhost:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      # Editor (not Viewer) so that anonymous users opening "Open in Grafana" links
      # from the admin observability page can use Explore. Viewer cannot reach
      # /explore and gets redirected to the home page (observed when admin
      # observability panel menus opened to homepage instead of the deep-link).
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_SECURITY_ALLOW_EMBEDDING: 'true'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../docs/observability/dashboards:/var/lib/grafana/dashboards_docs:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '${DEV_GRAFANA_PORT:-3001}:3000'
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  nats_data:
  mongodb_data:
  object_storage_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
