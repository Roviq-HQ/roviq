services:
  postgres:
    image: postgres:18-alpine
    ports: ["${DEV_POSTGRES_PORT:-5434}:5432"]
    environment:
      POSTGRES_USER: roviq
      POSTGRES_PASSWORD: roviq_dev
      POSTGRES_DB: roviq
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roviq"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["${DEV_REDIS_PORT:-6379}:6379"]
    # Development password, the same in every dev and e2e stack (REDIS_URL in .env.example).
    command: ["redis-server", "--requirepass", "roviq_redis_dev"]
    environment:
      REDISCLI_AUTH: roviq_redis_dev
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    ports:
      - "${DEV_NATS_PORT:-4222}:4222"
      - "${DEV_NATS_MONITOR_PORT:-8222}:8222"
    # Users and JetStream come from the shared config; development passwords (NATS_URL in
    # .env.example uses the gateway's).
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_MONITOR: 0.0.0.0:8222
      NATS_GATEWAY_PASSWORD: roviq_nats_gateway_dev
      NATS_NOTIFICATIONS_PASSWORD: roviq_nats_notifications_dev
    volumes:
      - nats_data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats-test:
    image: nats:2.10-alpine
    ports:
      - "${DEV_NATS_TEST_PORT:-4224}:4222"
      - "${DEV_NATS_TEST_MONITOR_PORT:-8224}:8222"
    command: ["--jetstream", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Scrapes NATS' built-in monitoring endpoint (`:8222`) and re-exposes
  # S3-compatible object storage. Production uses a managed S3 service (docs/deployment.md).
  object-storage:
    image: rustfs/rustfs:1.0.6
    ports:
      - "${DEV_STORAGE_PORT:-9002}:9000"
      - "${DEV_STORAGE_CONSOLE_PORT:-9003}:9001"
    environment:
      RUSTFS_ACCESS_KEY: roviq_storage
      RUSTFS_SECRET_KEY: roviq_storage_dev
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: /data
    volumes:
      # A named volume: the image runs as uid 10001 and cannot write a root-owned bind mount.
      - object_storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Temporal's own database role and its two databases (docker/temporal-db.sh); runs to the end
  # before Temporal starts.
  temporal-db:
    image: postgres:18-alpine
    entrypoint: ["/temporal-db.sh"]
    environment:
      PGHOST: postgres
      PGUSER: roviq
      PGPASSWORD: roviq_dev
      TEMPORAL_DB_PASSWORD: roviq_temporal_dev
    volumes:
      - ./temporal-db.sh:/temporal-db.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "${DEV_TEMPORAL_PORT:-7233}:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      # Its own role, which owns only Temporal's two databases; temporal-db creates both.
      POSTGRES_USER: roviq_temporal
      POSTGRES_PWD: roviq_temporal_dev
      SKIP_DB_CREATE: "true"
      POSTGRES_SEEDS: postgres
      # auto-setup runs four services, each with its own pool that keeps maxIdleConns open;
      # the 20/20 + 10/10 defaults held ~50 of Postgres's 100 slots while idle.
      SQL_MAX_CONNS: 10
      SQL_MAX_IDLE_CONNS: 2
      SQL_VIS_MAX_CONNS: 5
      SQL_VIS_MAX_IDLE_CONNS: 1
    depends_on:
      temporal-db:
        condition: service_completed_successfully

  temporal-ui:
    image: temporalio/ui:latest
    ports:
      - "${DEV_TEMPORAL_UI_PORT:-8233}:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233

  # Catches every email the notification service sends in dev; nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "${DEV_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${DEV_MAILPIT_WEB_PORT:-8025}:8025"

  # Logs, metrics, traces, dashboards and alerts in one container (docs/infrastructure.md →
  # "Observability"). Tilt label `observability`, off by default. Dev-only credentials.
  openobserve:
    image: openobserve/openobserve:v1.1.2
    environment:
      ZO_ROOT_USER_EMAIL: dev@roviq.local
      ZO_ROOT_USER_PASSWORD: Roviq-observe-1
      ZO_DATA_DIR: /data
      # No usage reports to the vendor.
      ZO_TELEMETRY: "false"
      # It grows into whatever memory it is given and preallocates write-ahead-log files (MB).
      ZO_MEMORY_CACHE_MAX_SIZE: "128"
      ZO_MEMORY_CACHE_DATAFUSION_MAX_SIZE: "256"
      ZO_MEM_TABLE_MAX_SIZE: "128"
      ZO_MAX_FILE_SIZE_IN_MEMORY: "32"
      ZO_MAX_FILE_SIZE_ON_DISK: "16"
      ZO_COMPACT_DATA_RETENTION_DAYS: "7"
      # Alert emails land in Mailpit.
      ZO_SMTP_ENABLED: "true"
      ZO_SMTP_HOST: mailpit
      ZO_SMTP_PORT: "1025"
      ZO_SMTP_FROM_EMAIL: alerts@roviq.local
    mem_limit: 1g
    cpus: 2
    volumes:
      - openobserve_data:/data
    ports:
      - "${DEV_OPENOBSERVE_PORT:-5080}:5080"
      - "${DEV_OPENOBSERVE_GRPC_PORT:-5081}:5081"

volumes:
  postgres_data:
  redis_data:
  nats_data:
  object_storage_data:
  openobserve_data:
