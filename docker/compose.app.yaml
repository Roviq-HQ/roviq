# Settings every container gets unless it says otherwise: no new privileges, a process limit.
x-contained: &contained
  security_opt: ["no-new-privileges:true"]
  pids_limit: 512

# The three apps run as an unprivileged user and write only to /tmp.
x-app-contained: &app-contained
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp"]
  pids_limit: 512

services:
  postgres:
    image: postgres:18-alpine
    <<: *contained
    # What the image's entrypoint needs to hand the data folder to the postgres user.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 2g
    networks: [backplane]
    environment:
      POSTGRES_USER: roviq
      POSTGRES_PASSWORD: roviq_dev
      POSTGRES_DB: roviq
    volumes:
      - roviq-pgdata:/var/lib/postgresql
      # init-db.sh creates the four-role model (roviq_pooler/app/reseller/admin)
      # on first boot. Required for runtime DSNs below to work.
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roviq"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    <<: *contained
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    mem_limit: 512m
    networks: [backplane]
    # Every client signs in. The default is the development password; an override that holds
    # real data sets REDIS_PASSWORD (compose.staging.yaml requires it).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-roviq_redis_dev}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-roviq_redis_dev}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    <<: *contained
    cap_drop: [ALL]
    mem_limit: 512m
    networks: [backplane]
    # One user per service (docker/nats.conf). Monitoring answers inside the container only,
    # for the health check below.
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_MONITOR: 127.0.0.1:8222
      NATS_GATEWAY_PASSWORD: ${NATS_GATEWAY_PASSWORD:-roviq_nats_gateway_dev}
      NATS_NOTIFICATIONS_PASSWORD: ${NATS_NOTIFICATIONS_PASSWORD:-roviq_nats_notifications_dev}
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      # 127.0.0.1, not localhost: monitoring listens on IPv4 only.
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  object-storage:
    image: rustfs/rustfs:1.0.6
    <<: *contained
    cap_drop: [ALL]
    mem_limit: 1g
    networks: [backplane]
    # Published so the browser can reach presigned URLs. Create the buckets once with `pnpm storage:init`.
    ports: ["9002:9000"]
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: roviq_storage
      RUSTFS_SECRET_KEY: roviq_storage_dev
      RUSTFS_ADDRESS: ":9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Malware scanning is off for now. To turn it on: uncomment this service and the clamav-db
  # volume, and set FILE_SCANNER=clamav and CLAMAV_HOST=clamav on api-gateway (docs/deployment.md).
  # Malware scanner for uploaded documents (ROV-303). Needs about 1.5 GB of memory; the first
  # start downloads the signature database, so allow it a few minutes to become healthy.
  # clamav:
  #   image: clamav/clamav:1.4
  #   networks: [backplane]
  #   volumes:
  #     - clamav-db:/var/lib/clamav
  #   healthcheck:
  #     test: ["CMD", "clamdcheck.sh"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 300s

  # Logs, metrics, traces, dashboards and alerts (docs/deployment.md → "Telemetry"). No published
  # port: the UI and the API are reachable on the private network only.
  openobserve:
    image: openobserve/openobserve:v1.1.2
    <<: *contained
    networks: [backplane]
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_USER:?OPENOBSERVE_USER must be set}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD:?OPENOBSERVE_PASSWORD must be set}
      ZO_DATA_DIR: /data
      # No usage reports to the vendor.
      ZO_TELEMETRY: "false"
      # It grows into whatever memory it is given and preallocates write-ahead-log files (MB).
      ZO_MEMORY_CACHE_MAX_SIZE: "256"
      ZO_MEMORY_CACHE_DATAFUSION_MAX_SIZE: "512"
      ZO_MEM_TABLE_MAX_SIZE: "256"
      ZO_MAX_FILE_SIZE_IN_MEMORY: "64"
      ZO_MAX_FILE_SIZE_ON_DISK: "32"
      ZO_COMPACT_DATA_RETENTION_DAYS: "30"
      # Mail server for alert emails; without it `pnpm observability:load` loads no alerts.
      ZO_SMTP_ENABLED: ${OPENOBSERVE_SMTP_ENABLED:-false}
      ZO_SMTP_HOST: ${OPENOBSERVE_SMTP_HOST:-}
      ZO_SMTP_PORT: ${OPENOBSERVE_SMTP_PORT:-587}
      ZO_SMTP_USER_NAME: ${OPENOBSERVE_SMTP_USER:-}
      ZO_SMTP_PASSWORD: ${OPENOBSERVE_SMTP_PASSWORD:-}
      ZO_SMTP_FROM_EMAIL: ${OPENOBSERVE_SMTP_FROM:-}
      ZO_SMTP_ENCRYPTION: ${OPENOBSERVE_SMTP_ENCRYPTION:-starttls}
    mem_limit: 2g
    cpus: 1
    volumes:
      - roviq-openobserve:/data

  # Temporal's own database role and its two databases (docker/temporal-db.sh); runs to the end
  # before Temporal starts, on every start.
  temporal-db:
    image: postgres:18-alpine
    <<: *contained
    cap_drop: [ALL]
    networks: [backplane]
    entrypoint: ["/temporal-db.sh"]
    environment:
      PGHOST: postgres
      PGUSER: roviq
      PGPASSWORD: roviq_dev
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:-roviq_temporal_dev}
    volumes:
      - ./temporal-db.sh:/temporal-db.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/auto-setup:latest
    <<: *contained
    cap_drop: [ALL]
    mem_limit: 1g
    networks: [backplane, workflow]
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: roviq_temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-roviq_temporal_dev}
      SKIP_DB_CREATE: "true"
      POSTGRES_SEEDS: postgres
      # auto-setup runs four services, each with its own pool that keeps maxIdleConns open;
      # the 20/20 + 10/10 defaults held ~50 of Postgres's 100 slots while idle.
      SQL_MAX_CONNS: 10
      SQL_MAX_IDLE_CONNS: 2
      SQL_VIS_MAX_CONNS: 5
      SQL_VIS_MAX_IDLE_CONNS: 1
    depends_on:
      temporal-db:
        condition: service_completed_successfully

  # No published port: the UI has no sign-in of its own. Reach it through a tunnel or a proxy
  # that asks for one (docs/deployment.md → "Staging").
  temporal-ui:
    image: temporalio/ui:latest
    <<: *contained
    cap_drop: [ALL]
    mem_limit: 256m
    networks: [workflow]
    environment:
      TEMPORAL_ADDRESS: temporal:7233

  migrator:
    image: ghcr.io/roviq-hq/migrator:${ROVIQ_VERSION:-latest}
    <<: *contained
    cap_drop: [ALL]
    networks: [backplane]
    profiles: ["tools"]
    environment:
      # Migrator runs as superuser — schema changes require it.
      DATABASE_URL_MIGRATE: postgresql://roviq:roviq_dev@postgres:5432/roviq
      REDIS_URL: redis://:${REDIS_PASSWORD:-roviq_redis_dev}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    image: ghcr.io/roviq-hq/api-gateway:${ROVIQ_VERSION:-latest}
    <<: *app-contained
    mem_limit: 1536m
    cpus: 2
    networks: [backplane, workflow]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    ports: ["3000:3000"]
    environment:
      # Four-role model: runtime connects via roviq_pooler (LOGIN, NOINHERIT).
      # App roles (app/reseller/admin) are assumed via SET LOCAL ROLE inside
      # withTenant/withReseller/withAdmin wrappers.
      DATABASE_URL: postgresql://roviq_pooler:roviq_pooler_dev@postgres:5432/roviq
      DATABASE_URL_MIGRATE: postgresql://roviq:roviq_dev@postgres:5432/roviq
      REDIS_URL: redis://:${REDIS_PASSWORD:-roviq_redis_dev}@redis:6379
      NATS_URL: nats://gateway:${NATS_GATEWAY_PASSWORD:-roviq_nats_gateway_dev}@nats:4222
      # Local values. The image runs with NODE_ENV=production, which refuses plain-http browser
      # storage and an unset MESSAGING_ENCRYPTION_KEY, so this file boots the gateway only under an
      # override that sets them (compose.staging.yaml; docs/deployment.md → "Object storage").
      S3_ENDPOINT: http://object-storage:9000
      S3_ACCESS_KEY: roviq_storage
      S3_SECRET_KEY: roviq_storage_dev
      S3_PUBLIC_ENDPOINT: http://localhost:9002
      S3_REGION: us-east-1
      S3_BUCKET_PRIVATE: roviq-private
      S3_BUCKET_PUBLIC: roviq-public
      S3_PUBLIC_BASE_URL: http://localhost:9002/roviq-public
      FILE_SCANNER: "off"
      TEMPORAL_ADDRESS: temporal:7233
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      API_GATEWAY_PORT: 3000
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: Roviq
      ALLOWED_ORIGINS: http://localhost:4200
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5081
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:?OTEL_EXPORTER_OTLP_HEADERS must be set}
      OTEL_SERVICE_NAME: api-gateway
      OPENOBSERVE_URL: http://openobserve:5080
      OPENOBSERVE_USER: ${OPENOBSERVE_USER:?OPENOBSERVE_USER must be set}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:?OPENOBSERVE_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  # Talks to the API through its public name, so it joins no internal network.
  web:
    image: ghcr.io/roviq-hq/web:${ROVIQ_VERSION:-latest}
    <<: *app-contained
    mem_limit: 768m
    cpus: 1
    networks: [edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    ports: ["4200:4200"]
    environment:
      PORT: 4200
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: ws://localhost:3000
      # The file store origins the browser may load from and upload to (content security policy).
      S3_PUBLIC_ENDPOINT: http://localhost:9002
      S3_PUBLIC_BASE_URL: http://localhost:9002/roviq-public
    depends_on:
      api-gateway:
        condition: service_started

  notification-service:
    image: ghcr.io/roviq-hq/notification-service:${ROVIQ_VERSION:-latest}
    <<: *app-contained
    mem_limit: 768m
    cpus: 1
    networks: [backplane, workflow]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    ports: ["3002:3002"]
    environment:
      # Four-role model: runtime connects via roviq_pooler.
      DATABASE_URL: postgresql://roviq_pooler:roviq_pooler_dev@postgres:5432/roviq
      REDIS_URL: redis://:${REDIS_PASSWORD:-roviq_redis_dev}@redis:6379
      NATS_URL: nats://notifications:${NATS_NOTIFICATIONS_PASSWORD:-roviq_nats_notifications_dev}@nats:4222
      NOTIFICATION_SERVICE_PORT: 3002
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5081
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:?OTEL_EXPORTER_OTLP_HEADERS must be set}
      OTEL_SERVICE_NAME: notification-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

# Networks by need. A service joins only the ones it uses. Two inside the stack, not one per
# service: a Docker host has a limited number of network address ranges.
networks:
  # PostgreSQL, Redis, NATS, object storage, the mail catcher, telemetry, Temporal and the two
  # backend apps. Every service on it asks for credentials, bar Temporal's own port.
  backplane:
  # Temporal's console reaches Temporal here and nothing else.
  workflow:
  # The web app's own: it reaches the API through the API's public address.
  edge:

volumes:
  # clamav-db:
  roviq-pgdata:
  roviq-openobserve:
